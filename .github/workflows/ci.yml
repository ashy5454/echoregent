name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Run test suite (vitest)
        # Note: Runs the test suite honestly without hiding failures or using '|| true'.
        # Existing TODO cases remain visible in the test summary.
        run: npm test
