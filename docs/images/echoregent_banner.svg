<svg width="880" height="180" viewBox="0 0 880 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EchoRegent — The Token Management Layer for AI Agents">
  <defs>
    <linearGradient id="wave-grad-default" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#00c9b1"/>
    </linearGradient>
    <linearGradient id="token-grad-default" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c9b1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="regent-grad-default" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c9b1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="bg-glow-default" cx="110" cy="90" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00c9b1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00c9b1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="180" rx="12" fill="#080c14"/>
  <rect width="880" height="180" rx="12" fill="url(#bg-glow-default)"/>
  <rect x="0.5" y="0.5" width="879" height="179" rx="11.5" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Logo Mark: Geometric Acoustic-Wave-to-Token -->
  <g id="logo-mark">
    <!-- Acoustic Wave Resonance Bars -->
    <rect x="58" y="72" width="7" height="36" rx="3.5" fill="url(#wave-grad-default)"/>
    <rect x="71" y="56" width="7" height="68" rx="3.5" fill="url(#wave-grad-default)"/>
    <rect x="84" y="42" width="7" height="96" rx="3.5" fill="url(#wave-grad-default)"/>
    <rect x="97" y="54" width="7" height="72" rx="3.5" fill="url(#wave-grad-default)"/>

    <!-- Wave-to-Token Quantization Pulses -->
    <rect x="110" y="50" width="6" height="20" rx="3" fill="url(#wave-grad-default)" opacity="0.85"/>
    <rect x="110" y="78" width="6" height="24" rx="3" fill="url(#token-grad-default)" opacity="0.95"/>
    <rect x="110" y="110" width="6" height="20" rx="3" fill="url(#token-grad-default)" opacity="0.85"/>

    <!-- Quantized Geometric Token Blocks -->
    <rect x="123" y="50" width="14" height="14" rx="3.5" fill="url(#token-grad-default)"/>
    <rect x="123" y="71" width="14" height="14" rx="3.5" fill="url(#token-grad-default)"/>
    <rect x="123" y="92" width="14" height="14" rx="3.5" fill="url(#token-grad-default)"/>
    <rect x="123" y="113" width="14" height="14" rx="3.5" fill="url(#token-grad-default)"/>

    <rect x="142" y="60" width="14" height="14" rx="3.5" fill="url(#token-grad-default)"/>
    <rect x="142" y="81" width="14" height="14" rx="3.5" fill="url(#token-grad-default)"/>
    <rect x="142" y="102" width="14" height="14" rx="3.5" fill="url(#token-grad-default)"/>
  </g>

  <!-- Wordmark & Subtitle -->
  <text x="182" y="94" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5" fill="#f8fafc">Echo<tspan fill="url(#regent-grad-default)">Regent</tspan></text>
  <text x="184" y="126" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0.2" fill="#94a3b8">The Token Management Layer for AI Agents</text>
</svg>
